[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adtx-attribution"
version = "0.5.0"
description = "Ad-tech supply-chain and registry collectors for attribution-graph"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tushar Karumudi" }]
keywords = ["ads.txt", "sellers.json", "osint", "attribution", "ad-fraud",
            "made-for-advertising", "threat-intelligence", "gleif", "edgar"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["attribution-graph>=0.1.0", "httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
favicon = ["mmh3>=4.1"]
persona = ["pgpy>=0.6"]   # plus optional CLI tools: holehe, xeuledoc
all = ["mmh3>=4.1", "pgpy>=0.6"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
adtx = "adtx_attribution.cli:_cli"
adtx-index = "adtx_attribution.index:_main"

[project.urls]
Homepage = "https://github.com/OWNER/adtx-attribution"
Issues = "https://github.com/OWNER/adtx-attribution/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/adtx_attribution"]

[tool.hatch.build.targets.wheel.force-include]
"src/adtx_attribution/data" = "adtx_attribution/data"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP017"]  # UP017: timezone.utc reads clearer than the UTC alias
